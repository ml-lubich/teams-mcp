[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-mcp"
version = "0.1.0"
description = "Typed CLI and MCP client for Microsoft Teams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
teams = "teams_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["teams_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
